<script id="mms-home-r1-js">
(function(){'use strict';var root=document.getElementById('mms-home-r1');if(!root||root.dataset.ready==='1')return;root.dataset.ready='1';document.documentElement.classList.add('ms-r1-js');document.documentElement.setAttribute('data-mmd-world','mms');
var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches,booking=root.dataset.booking||'/male-massage/member/mms-booking';
var langBtn=root.querySelector('.ms-lang'),langList=root.querySelector('.ms-langlist'),langLabel=langBtn&&langBtn.querySelector('span');function setLang(l){if(['th','en','zh'].indexOf(l)<0)l='th';root.dataset.lang=l;if(langLabel)langLabel.textContent=l==='zh'?'中文':l.toUpperCase();document.documentElement.lang=l==='zh'?'zh-Hans':l;try{localStorage.setItem('mms_lang',l)}catch(_){ }if(langList)langList.hidden=true;if(langBtn)langBtn.setAttribute('aria-expanded','false')}try{setLang(localStorage.getItem('mms_lang')||'th')}catch(_){setLang('th')}if(langBtn)langBtn.addEventListener('click',function(){var open=langList.hidden;langList.hidden=!open;langBtn.setAttribute('aria-expanded',String(open))});root.querySelectorAll('[data-set-lang]').forEach(function(b){b.addEventListener('click',function(){setLang(b.dataset.setLang)})});
var menu=root.querySelector('.ms-menu'),nav=root.querySelector('.ms-navlinks');if(menu&&nav){menu.addEventListener('click',function(){var open=!nav.classList.contains('is-open');nav.classList.toggle('is-open',open);menu.setAttribute('aria-expanded',String(open))});nav.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){nav.classList.remove('is-open');menu.setAttribute('aria-expanded','false')})})}
var selected=[],max=3,cards=[].slice.call(root.querySelectorAll('[data-skill]')),count=root.querySelector('[data-count]'),status=root.querySelector('[data-status]'),match=root.querySelector('.ms-match a');try{var saved=JSON.parse(sessionStorage.getItem('mms_selected_skills')||'[]');if(Array.isArray(saved))selected=saved.filter(function(v){return cards.some(function(c){return c.dataset.skill===v})}).slice(0,max)}catch(_){ }function sync(){cards.forEach(function(c){c.setAttribute('aria-pressed',String(selected.indexOf(c.dataset.skill)>-1))});if(count)count.textContent=selected.length+' / '+max;if(status){var t={th:selected.length?'พร้อมให้ MMS + AI ช่วย Match':'เลือกอย่างน้อย 1 Skill',en:selected.length?'Ready to match':'Choose at least one skill',zh:selected.length?'可以开始匹配':'请至少选择一项'};status.textContent=t[root.dataset.lang]||t.th}if(match){if(selected.length){match.removeAttribute('aria-disabled');match.href=booking+'?skills='+encodeURIComponent(selected.join(','))}else{match.setAttribute('aria-disabled','true');match.href=booking}}try{sessionStorage.setItem('mms_selected_skills',JSON.stringify(selected))}catch(_){ }}cards.forEach(function(c){c.addEventListener('click',function(){var v=c.dataset.skill,i=selected.indexOf(v);if(i>-1)selected.splice(i,1);else if(selected.length<max)selected.push(v);else{c.animate([{transform:'translateX(-3px)'},{transform:'translateX(3px)'},{transform:'none'}],{duration:220});return}sync()})});root.querySelectorAll('[data-set-lang]').forEach(function(b){b.addEventListener('click',function(){setTimeout(sync,0)})});sync();
var area=root.querySelector('.ms-area');if(area)area.addEventListener('submit',function(e){e.preventDefault();var v=area.elements.area.value,url=booking+(v?'?area='+encodeURIComponent(v):'');window.location.href=url});
var details=[].slice.call(root.querySelectorAll('.ms-accordions details'));details.forEach(function(d){d.addEventListener('toggle',function(){if(d.open)details.forEach(function(o){if(o!==d)o.open=false})})});
var reveals=[].slice.call(root.querySelectorAll('.ms-reveal'));if(!('IntersectionObserver'in window)||reduce){reveals.forEach(function(el){el.classList.add('is-in')})}else{var io=new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting){e.target.classList.add('is-in');io.unobserve(e.target)}})},{threshold:.12,rootMargin:'0px 0px -7%'});reveals.forEach(function(el){io.observe(el)})}
document.addEventListener('click',function(e){if(langList&&!langList.hidden&&!root.querySelector('.ms-navtools').contains(e.target)){langList.hidden=true;langBtn.setAttribute('aria-expanded','false')}});document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(langList)langList.hidden=true;if(nav)nav.classList.remove('is-open');if(langBtn)langBtn.setAttribute('aria-expanded','false');if(menu)menu.setAttribute('aria-expanded','false')}});
})();
</script>
